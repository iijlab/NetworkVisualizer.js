<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Visualization (Mock Data)</title>

    <!-- Foundation CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css"
      crossorigin="anonymous"
    />

    <!-- Your custom styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/menu.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script type="module">
      import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";
      window.Plot = Plot;
    </script>
  </head>
  <body>
    <!-- Small screen menu bar -->
    <div class="title-bar show-for-small-only">
      <button class="menu-icon" type="button" data-toggle="offCanvas"></button>
      <div class="title-bar-title">Menu</div>
    </div>

    <!-- Off-canvas wrapper -->
    <div class="off-canvas-wrapper">
      <!-- Off-canvas menu -->
      <div
        class="off-canvas position-left reveal-for-medium"
        id="offCanvas"
        data-off-canvas
        data-transition="overlap"
      >
        <div class="top-bar">
          <button
            class="close-button"
            aria-label="Close menu"
            type="button"
            data-close
          >
            <span aria-hidden="true">&times;</span>
          </button>
          <ul class="vertical menu accordion-menu" id="menu" data-accordion-menu data-submenu-toggle="true">
            <li class="menu-text">Settings</li>
            <li>
              <a href="#resources">Resources</a>
              <ul class="menu vertical nested">
                <li><a href="#select-resources">Select Resources</a></li>
                <li><a href="#resource-filters">Resource Filters</a></li>
              </ul>
            </li>
            <li>
              <a href="#metrics">Metrics Settings</a>
              <ul class="menu vertical nested">
                <li><a href="#metric-selection">Select Metrics</a></li>
                <li><a href="#metric-thresholds">Thresholds</a></li>
                <li><a href="#metric-alerts">Alerts</a></li>
              </ul>
            </li>
            <li>
              <a href="#plotting">Plotting Settings</a>
              <ul class="menu vertical nested">
                <li><a href="#plot-style">Style</a></li>
                <li><a href="#plot-colors">Colors</a></li>
                <li><a href="#plot-layout">Layout</a></li>
              </ul>
            </li>
            <li>
              <a href="#network">Network Settings</a>
              <ul class="menu vertical nested">
                <li><a href="#network-layout">Layout</a></li>
                <li><a href="#network-style">Style</a></li>
              </ul>
            </li>
            <li><a href="#other">Other Settings</a></li>
          </ul>
        </div>
      </div>

      <!-- Main content -->
      <div class="off-canvas-content" data-off-canvas-content>
        <div class="grid-y medium-grid-frame">
          <!-- Network Navigation Bar -->
          <div class="cell shrink">
            <div class="navigation-bar">
          <div class="network-path">
            <!-- Path segments will be dynamically populated by NetworkVisualizer -->
          </div>
            </div>
          </div>
          <div class="cell auto">
            <div class="grid-x height-100">
              <!-- Network Visualization Section -->
              <div class="cell large-6 visualization-cell">
                <div class="grid-y height-100">
                  <div class="cell auto visualization-section">
                    <div class="visualization-container">
                      <svg id="network"></svg>
                    </div>
                  </div>
                  <div class="cell shrink metric-legend">
                    <h4>Metric Legend</h4>
                    <div class="legend-content">
                      <!-- Legend content will be dynamically populated -->
                    </div>
                  </div>
                  </div>
                </div>

                <!-- Details Section -->
                <div class="cell large-6 details-cell">
                  <div id="details-panel" class="details-section">
                    <div class="details-container">
                      <!-- Details content will be dynamically populated here -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Set mock data flag before loading any scripts -->
    <script>
      window.USE_MOCK_DATA = true;
    </script>

    <!-- Foundation required JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/js/foundation.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Initialize Foundation -->
    <script>
      $(document).ready(function () {
        $(document).foundation();
        // Re-initialize Foundation components after dynamic content updates
        $(document).on("replaced.zf.orbit added.zf.orbit", function () {
          $(document).foundation();
        });
      });
    </script>

    <!-- Load the application scripts -->
    <script type="module" src="js/init.js"></script>
  </body>
</html>
